[automount]
# Windows drives visible under /mnt/<drive>, mounted read-only (mode: ro).
# Linux (and anything that escapes a container) can read C: but not modify it.
enabled = true
options = "metadata,umask=22,fmask=11,ro"
mountFsTab = false

[network]
# These are the defaults; stated explicitly so the intent is visible.
generateHosts = true
generateResolvConf = true

[interop]
# Windows .exe files runnable from Linux, Windows PATH appended to $PATH.
# Needed for `code .` from Windows Terminal and for clip.exe / explorer.exe bridges.
enabled = true
appendWindowsPath = true
