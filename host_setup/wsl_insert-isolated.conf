[automount]
# No Windows drives under /mnt/ (mode: isolated).
# The one exception is the VS Code extensions folder, mounted read-only by the
# /etc/fstab line that wsl_conf_update.sh manages. VS Code Remote WSL bootstraps
# by running scripts/wslServer.sh out of that folder; without it the connection
# fails with "wsl: Failed to translate". Nothing else on C: is visible.
enabled = false
mountFsTab = true

[network]
# These are the defaults; stated explicitly so the intent is visible.
generateHosts = true
generateResolvConf = true

[interop]
# No Windows .exe launch from Linux, no Windows PATH entries on $PATH.
# `code .` and `just code <profile> <repo>` work only from a VS Code integrated
# terminal, where `code` resolves to ~/.vscode-server/.../remote-cli/code.
enabled = false
appendWindowsPath = false
