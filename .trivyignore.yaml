  # --- Deliberate design, not a defect ------------------------------------
  - id: DS-0002
    statement: "Container-side root is the design: rootless Docker maps container UID 0 to host UID 1000 (ARCHITECTURE.md, security posture). Long expiry — this is architecture, not a pending fix."
    expired_at: 2027-08-24
