# =============================================================================
# .trivyignore.yaml — CVEs & misconfigs explicitly accepted for
# windows-ai-sandbox. Every entry MUST carry a statement (why accepted) and
# expired_at (when to re-evaluate). On expiry the entry goes inactive and the
# finding re-appears in scans — that's the re-check signal.
#
# Workflow on re-check:
#   1. Re-run `scripts/trivy-scan.sh image`.
#   2. If still present: check upstream for a fix. If fixed, bump the tool
#      in the Dockerfile and re-scan (the entry can then be deleted).
#      If not fixed, extend expired_at with a refreshed statement.
#   3. If gone: delete the entry.
# =============================================================================

vulnerabilities:
  # --- Ubuntu base (digest-pinned) — fix exists, needs a deliberate pin bump
  # openssl/libssl3 3.0.13-0ubuntu3.4 -> 3.0.13-0ubuntu3.11. The FROM digest
  # freezes the base by design; clearing this means bumping the pin (see the
  # base-image note in the 2026-08-24 scan review), not rebuilding.
  - id: CVE-2026-45447
    statement: "openssl in the digest-pinned CUDA base; fixed in ubuntu3.11 — clears at the next deliberate base-digest bump."
    expired_at: 2026-08-31

  # --- npm-installed CLI bundled deps — arrive with upstream CLI releases,
  # behind the 7-day build-time quarantine (min-release-age). ReDoS-class /
  # path-handling issues in brace-expansion, ip-address, tar; not reachable
  # as a service — these are CLI-internal libs behind seccomp + egress.
  - id: CVE-2026-14257
    statement: "brace-expansion bundled by the AI CLIs; clears when upstream ships bumped deps + a --refresh-ai rebuild."
    expired_at: 2026-08-31
  - id: CVE-2026-69152
    statement: "brace-expansion bundled by the AI CLIs; clears when upstream ships bumped deps + a --refresh-ai rebuild."
    expired_at: 2026-08-31
  - id: CVE-2026-69192
    statement: "ip-address bundled by the AI CLIs; clears when upstream ships bumped deps + a --refresh-ai rebuild."
    expired_at: 2026-08-31
  - id: CVE-2026-73566
    statement: "tar bundled by the AI CLIs; clears when upstream ships bumped deps + a --refresh-ai rebuild."
    expired_at: 2026-08-31

  # --- gh (apt) — golang.org/x/mod in gh's own modules; needs a newer gh
  # release, picked up by apt at the next rebuild.
  - id: CVE-2026-56864
    statement: "x/mod inside the gh binary; upstream release + rebuild clears it."
    expired_at: 2026-08-31
  - id: CVE-2026-56865
    statement: "x/mod inside the gh binary; upstream release + rebuild clears it."
    expired_at: 2026-08-31

  # --- bd (beads) — static Go binary with stale x/crypto et al.; entirely on
  # upstream to rebuild. 29 findings, one acceptance: check beads for a newer
  # release at expiry; if none, extend with a refreshed statement.
