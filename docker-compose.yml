# =============================================================================
# windows-ai-sandbox — multi-profile CUDA + Claude Code stack (hardened)
# =============================================================================
# Parameterized by PROFILE. Drive via scripts/profile.sh, which exports PROFILE
# and COMPOSE_PROJECT_NAME=ai-sandbox-<profile>. Each profile gets its own
# containers, compose-managed networks, and state dir — concurrent profiles
# do not share any of these.
#
# Network model (load-bearing — see sandbox-hardening-package.md §4):
#   sandbox-internal (internal: true)  — agent-only; no direct internet
#   sandbox-external                   — Squid proxy's outbound side
# The proxy is the ONLY way out. Allowlist: proxy/allowed_domains.txt
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # CUDA + Claude Code agent container — one per profile
  # ---------------------------------------------------------------------------
  ai-sandbox:
    build:
      context: .
      dockerfile: Dockerfile
    image: windows-ai-sandbox:latest
    container_name: ai-sandbox-${PROFILE:?PROFILE env var required — use scripts/profile.sh}
    hostname: ai-sandbox-${PROFILE}

    # GPU passthrough lives in docker-compose.wsl-gpu.yml — an overlay that
    # profile.sh layers on automatically when the host is WSL2 with a GPU
    # (/dev/dxg present; override with SANDBOX_GPU=0|1). This base file must
    # come up cleanly on bare-Linux hosts with no GPU.

    # Hardening — non-negotiable per audit §4.
    security_opt:
      - no-new-privileges:true
      - seccomp=./seccomp.json
    cap_drop:
      - ALL
    pids_limit: 4096
    mem_limit: 20g
    memswap_limit: 20g
    cpus: 4
    ulimits:
      nofile:
        soft: 2048
        hard: 8192

    # tmpfs for scratch + npm/local under /root (container root = host UID 1000
    # via rootless Docker userns=host). noexec explicit per audit Finding G.
    tmpfs:
      - /tmp:size=1g,noexec,nosuid,nodev
      - /run:size=64m,noexec,nosuid,nodev
      - /root/.npm-global:size=512m,noexec,nosuid,nodev
      - /root/.local:size=256m,noexec,nosuid,nodev

    volumes:
      # The profile's repo parent folder = /workspace. Holds many repos.
      - ${HOME}/repo/${PROFILE}:/workspace:rw

      # Per-profile persistent state (auth, config, caches) — outlives recreates.
      - ${HOME}/.ai-sandbox/profiles/${PROFILE}/claude-home:/root/.claude:rw
      - ${HOME}/.ai-sandbox/profiles/${PROFILE}/claude.json:/root/.claude.json:rw
      - ${HOME}/.ai-sandbox/profiles/${PROFILE}/cache:/root/.cache:rw
      # .config mounted as a directory (not per-file) — git's atomic rename()
      # during `git config --global set` fails with EBUSY across single-file
      # bind mounts. Directory mounts avoid that.
      - ${HOME}/.ai-sandbox/profiles/${PROFILE}/config:/root/.config:rw
      # Per-profile Antigravity CLI (agy) state — agy reuses the ~/.gemini home
      # (config/keybindings/cache under /root/.gemini/antigravity-cli/). Host dir
      # is still named gemini-home (former Gemini CLI mount; kept to avoid churn).
      # The auth token is NOT persisted here — re-auth at the console per rebuild.
      - ${HOME}/.ai-sandbox/profiles/${PROFILE}/gemini-home:/root/.gemini:rw
      # Per-profile Kaggle CLI credential. The `kaggle` CLI reads
      # ~/.kaggle/kaggle.json by default (or KAGGLE_USERNAME/KAGGLE_KEY env);
      # this mount persists the key across recreates like the other auth dirs.
      # Its 600 perms carry through the bind mount — the CLI refuses a
      # group/world-readable key. Egress to Kaggle is already gated by the
      # [kaggle] block in allowed_domains.txt, so this mount adds NO network
      # reach. Optional: ensure_state creates the host dir empty, so profiles
      # without a key still come up cleanly.
      - ${HOME}/.ai-sandbox/profiles/${PROFILE}/kaggle:/root/.kaggle:rw

    environment:
      - GIT_CONFIG_GLOBAL=/root/.config/git/config
      - SANDBOX_PROFILE=${PROFILE}
      # UV_PROJECT_ENVIRONMENT=.venv-sandbox: THE ENVIRONMENT NAMES THE VENV
      # (ADR-0013). /workspace is the host's checkout, so every repo's plain
      # `.venv` is the HOST's venv. uv, finding a project env it cannot use,
      # DELETES AND RECREATES it — and on this substrate the failure is QUIET:
      # host and image are both Ubuntu 24.04 with /usr/bin/python3 at the same
      # path, so a venv often runs on both sides until one of them switches
      # interpreter (the image's /opt/uv 3.13, say) and uv silently rebuilds it
      # for the other. With this set, the container's uv builds and uses
      # <repo>/.venv-sandbox and never looks at .venv. RELATIVE on purpose: it
      # resolves against each project root (absolute would put every repo in
      # one venv). Hosts leave it unset. Not UV_PYTHON, which is `--python` and
      # would override every repo's .python-version. Compose, not Dockerfile
      # ENV, for the same recreate-not-rebuild reason UV_LINK_MODE is the
      # exception: that one is build-relevant, this one only matters where the
      # bind mounts are. verify-sandbox.sh asserts the exact value; the deletion
      # hook's disposable carve-out and scripts/workspace-scan.py key on it.
      - UV_PROJECT_ENVIRONMENT=.venv-sandbox
      # Substrate metadata, NOT GPU wiring (which lives only in the wsl-gpu
      # overlay): profile.sh exports 1 when the host has /dev/dxg, so
      # verify-sandbox.sh can flag a WSL host whose overlay failed to layer
      # instead of reporting a reassuring N/A. Defaults 0 off profile.sh.
      - SANDBOX_HOST_GPU=${SANDBOX_HOST_GPU:-0}
      # All outbound HTTP(S) is forced through the Squid sidecar.
      - HTTP_PROXY=http://egress-proxy:3128
      - HTTPS_PROXY=http://egress-proxy:3128
      - http_proxy=http://egress-proxy:3128
      - https_proxy=http://egress-proxy:3128
      # `ollama` is the first HTTP sibling (postgres/mongo do not speak HTTP, so
      # they never needed a bypass). Without it every request to the local
      # inference endpoint would be CONNECTed through Squid, which denies a
      # non-allowlisted host — a base URL that fails on every call. Both cases
      # are set: Node/Claude Code read the upper-case form, curl/uv the lower.
      - NO_PROXY=localhost,127.0.0.1,egress-proxy,ollama
      - no_proxy=localhost,127.0.0.1,egress-proxy,ollama

    networks:
      sandbox-internal:
    # DNS lockdown (closes the DNS-exfil side channel that internal:true does
    # NOT close on its own). Docker's embedded resolver at 127.0.0.11 forwards
    # queries to the host's resolver, which can reach the internet — an agent
    # could exfil data in crafted subdomain queries (e.g. secret.evil.com).
    # Sinkholing to 127.0.0.1 makes all DNS lookups fail, then extra_hosts
    # below provides the handful of names the agent legitimately needs. This
    # pair — sinkhole + static hosts — is tighter than relying on the proxy
    # alone, because DNS exfil bypasses HTTP-level controls entirely.
    dns:
      - 127.0.0.1
    extra_hosts:
      - "egress-proxy:172.30.${SANDBOX_OCTET:-0}.10"
      - "postgres:172.30.${SANDBOX_OCTET:-0}.20"
      - "mongo:172.30.${SANDBOX_OCTET:-0}.30"
      # Unconditional, like the DB siblings: the name resolves whether or not
      # the `ollama` compose profile is active. A host entry for a container
      # that is not up costs nothing (connect refused), and making it
      # conditional would mean a second extra_hosts list to keep in sync.
      - "ollama:172.30.${SANDBOX_OCTET:-0}.40"
    env_file:
      # Optional DB creds — only present for profiles that opted into the
      # postgres/mongo sibling containers. required: false so profiles
      # without DBs still come up cleanly.
      - path: ${HOME}/.ai-sandbox/profiles/${PROFILE}/db.env
        required: false
      # Optional API keys for the web-read broker (webfetch) and any other
      # allowlisted service the agent drives — e.g. TAVILY_API_KEY. Keys are
      # read here at container CREATE only (recreate the agent after editing),
      # kept chmod 600, and never passed on argv. required: false so profiles
      # without keys still come up. See docs/web-read-broker.md.
      - path: ${HOME}/.ai-sandbox/profiles/${PROFILE}/secrets.env
        required: false
      # Claude Code backend switch (work/0023 §8) — WRITTEN BY
      # `scripts/profile.sh <p> backend anthropic|ollama|openrouter`, never by
      # hand. Holds only ANTHROPIC_BASE_URL / ANTHROPIC_AUTH_TOKEN / an empty
      # ANTHROPIC_API_KEY and the model aliases. Listed AFTER secrets.env on
      # purpose: a later env_file wins on duplicate keys, so the managed switch
      # overrides any ANTHROPIC_* an operator left in secrets.env. Absent =
      # Anthropic API (default). Same create-time semantics as the file above.
      - path: ${HOME}/.ai-sandbox/profiles/${PROFILE}/backend.env
        required: false

    depends_on:
      - egress-proxy

    working_dir: /workspace
    command: ["sleep", "infinity"]
    restart: "no"

  # ---------------------------------------------------------------------------
  # Optional: Postgres sibling (opt-in via COMPOSE_PROFILES=db-postgres)
  # ---------------------------------------------------------------------------
  # On sandbox-internal only — the agent reaches it at host `postgres:5432`.
  # Data lives in a named volume (ai-sandbox-<profile>_postgres-data) managed
  # by Docker inside the WSL2 ext4 rootfs. Back up anything important with
  # `pg_dump` to /workspace. Credentials come from
  # profiles/<profile>/db.env (template: sandbox_templates/common/db.env.template). File is
  # optional — without POSTGRES_PASSWORD the image refuses to start, which is
  # the behavior we want.
  postgres:
    # Pinned by digest (postgres:18 as of 2026-04-24). To refresh:
    #   docker pull postgres:18 && docker image inspect postgres:18 \
    #     --format '{{index .RepoDigests 0}}'
    image: postgres:18@sha256:78481659c47e862334611ccdaf7c369c986b3046da9857112f3b309114a65fb4
    container_name: postgres-${PROFILE}
    hostname: postgres
    profiles: ["db-postgres", "db-all"]
    env_file:
      - path: ${HOME}/.ai-sandbox/profiles/${PROFILE}/db.env
        required: false
    volumes:
      - postgres-data:/var/lib/postgresql:rw
    networks:
      sandbox-internal:
        ipv4_address: 172.30.${SANDBOX_OCTET:-0}.20
    # Uncomment to expose to host GUI tools (DBeaver, psql on WSL host).
    # Loopback-only — do not bind 0.0.0.0.
    # ports:
    #   - "127.0.0.1:5432:5432"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    mem_limit: 2g
    cpus: 2
    restart: "no"

  # ---------------------------------------------------------------------------
  # Optional: MongoDB sibling (opt-in via COMPOSE_PROFILES=db-mongo)
  # ---------------------------------------------------------------------------
  # Reach from the agent at host `mongo:27017`. Named volume for data.
  # If MONGO_INITDB_ROOT_USERNAME/PASSWORD are unset the image starts
  # without auth — acceptable on sandbox-internal (no external reachability),
  # but set them in db.env if you plan to publish the port.
  mongo:
    # Pinned by digest (mongo:8 as of 2026-04-24). To refresh:
    #   docker pull mongo:8 && docker image inspect mongo:8 \
    #     --format '{{index .RepoDigests 0}}'
    image: mongo:8@sha256:7abfba0d07c9330373f8173981ea4d09cd8a82cdf0e86ccaf7008848d1d24f62
    container_name: mongo-${PROFILE}
    hostname: mongo
    profiles: ["db-mongo", "db-all"]
    env_file:
      - path: ${HOME}/.ai-sandbox/profiles/${PROFILE}/db.env
        required: false
    volumes:
      - mongo-data:/data/db:rw
    networks:
      sandbox-internal:
        ipv4_address: 172.30.${SANDBOX_OCTET:-0}.30
    # Uncomment to expose to host GUI tools (Compass, mongosh on WSL host).
    # ports:
    #   - "127.0.0.1:27017:27017"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    mem_limit: 2g
    cpus: 2
    restart: "no"

  # ---------------------------------------------------------------------------
  # Optional: Ollama sibling — local LLM inference (opt-in via COMPOSE_PROFILES=ollama)
  # ---------------------------------------------------------------------------
  # Reach from the agent at `http://ollama:11434`. Since Ollama 0.14.0 that
  # endpoint speaks the Anthropic Messages API, so Claude Code itself can run
  # against it (`scripts/profile.sh <p> backend ollama --model <m>`, which
  # writes the profile's backend.env) with every
  # control this repo owns — deny lists, the hook engine, seccomp, egress —
  # still in place. See work/0023.
  #
  # AIR-GAPPED AT RUNTIME, deliberately: sandbox-internal only (internal: true),
  # no proxy variables, no published port. It cannot phone home, pull a model
  # at runtime, or exfiltrate. Models arrive ONLY through the host-side helper
  # `scripts/profile.sh <p> ollama pull`, which runs a throwaway container on
  # Docker's default bridge — outside this boundary, the same class of operator
  # action as `docker pull`.
  #
  # NOT in "db-all": inference is not a database, and a profile that wants a DB
  # should not silently acquire a 16g LLM runtime. `ollama` is its own token in
  # the profile's compose-profiles list (`profile.sh <p> ollama enable`).
  #
  # The model store is mounted READ-ONLY. Ollama's API includes create, delete,
  # copy and blob upload; with a shared writable store, profile A could plant a
  # Modelfile whose system prompt profile B then runs. Read-only closes that
  # cross-profile injection channel — and is what makes sharing the store
  # across profiles safe in the first place.
  #
  # Docker's DEFAULT seccomp profile, NOT ./seccomp.json. The strict profile is
  # an allowlist tuned for the agent image and is unmeasured against Ollama's
  # GPU runner — `creat`/`io_uring` are plausible casualties, and a syscall
  # denied by omission surfaces as an unexplained runtime failure, not as a
  # policy message. Tightening it is a follow-up after measurement, never a
  # silent widening here.
  ollama:
    # Pinned by index digest (ollama/ollama:latest = Ollama 0.33.3 as of
    # 2026-09-03). Multi-arch, so the digest comes from the index, not
    # RepoDigests. To refresh:
    #   docker buildx imagetools inspect ollama/ollama:latest
    image: ollama/ollama:latest@sha256:32931b46719f673c05fdbaa81ccb26da18ea4a1c57590a754874ab28ba269eb2
    container_name: ollama-${PROFILE}
    hostname: ollama
    profiles: ["ollama"]
    read_only: true
    tmpfs:
      # Ollama generates an id_ed25519 key pair under $HOME/.ollama on first
      # start and refuses to boot if it cannot write it. Ephemeral by design —
      # the key identifies a pushing client, which this container never is.
      - /root/.ollama:size=16m
      - /tmp:size=512m
    volumes:
      # Shared across profiles (multi-GB blobs), read-only to the runtime.
      # Written only by the host-side `ollama pull|create|rm` helper.
      - ${HOME}/.ai-sandbox/models/ollama:/models:ro
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      # Store root, so manifests/ and blobs/ sit directly under the shared dir
      # (Ollama's own default would nest them under $HOME/.ollama/models).
      - OLLAMA_MODELS=/models
      # Makes the no-phone-home explicit rather than incidental: at start the
      # server otherwise reaches for ollama.com (cloud cache hydration and model
      # recommendations). On sandbox-internal that already dies with "network is
      # unreachable" — correct, but by accident. This states the intent.
      - OLLAMA_NO_CLOUD=true
      # Default context window for every loaded model. Ollama's server default
      # is 4096, and a Claude Code request carries a system prompt well past
      # that — the server would silently truncate the head of every turn.
      # Ollama's own Claude Code guidance says at least 32K. Costs KV-cache
      # VRAM proportionally; a model can still override it per request.
      - OLLAMA_CONTEXT_LENGTH=32768
      # No OLLAMA_KEEP_ALIVE override: the 5-minute default is correct here.
      # One card is shared by every profile, so an idle profile must release
      # its VRAM rather than sit on it.
      # No HTTP_PROXY/HTTPS_PROXY either — this container has no outbound path
      # and must not be given one.
    networks:
      sandbox-internal:
        ipv4_address: 172.30.${SANDBOX_OCTET:-0}.40
    # Uncomment to reach it from host tools (a browser, `ollama` on the WSL
    # host). Loopback-only — do not bind 0.0.0.0.
    # ports:
    #   - "127.0.0.1:11434:11434"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 16g
    cpus: 4
    restart: "no"

  # ---------------------------------------------------------------------------
  # Egress proxy — domain-allowlisted outbound traffic
  # ---------------------------------------------------------------------------
  egress-proxy:
    # Pinned by digest — Squid is the single choke-point for all agent egress,
    # so an unvetted tag bump could re-open a bypass. Mirrors the macolima
    # pin (ubuntu/squid:latest as of 2026-04-24). To refresh:
    #   docker pull ubuntu/squid:latest && docker image inspect ubuntu/squid:latest \
    #     --format '{{index .RepoDigests 0}}'
    image: ubuntu/squid:latest@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    container_name: egress-proxy-${PROFILE}
    hostname: egress-proxy
    read_only: true
    tmpfs:
      # Squid starts as root (writes /run/squid.pid, opens cache.log) then
      # drops to user `proxy` (uid 13, baked into ubuntu/squid image) via
      # cache_effective_user. After drop, Squid opens access.log and writes
      # cache disk. Tmpfs ownership needs to satisfy both phases:
      #   /var/spool/squid  — post-drop only → proxy:proxy
      #   /var/log/squid    — cache.log (root) + access.log (proxy) → root:proxy 0775
      #   /run              — /run/squid.pid written by root → leave default
      - /var/spool/squid:size=256m,uid=13,gid=13,mode=0750
      - /var/log/squid:size=64m,uid=0,gid=13,mode=0775
      - /run:size=8m
    volumes:
      # squid.conf stays a FILE mount: squid reads /etc/squid/squid.conf by
      # default, and a config change needs a restart to be parsed anyway, so the
      # snapshot semantics below are harmless for it. (0 of the last 49 commits
      # touched it; 10 touched the allowlist. Same mount style, opposite edit
      # profiles — which is why only one of them ever caused trouble.)
      - ./proxy/squid.conf:/etc/squid/squid.conf:ro
      # The allowlist is mounted as a DIRECTORY, deliberately. A single-file bind
      # mount resolves to an inode ONCE, at container start, so anything that
      # replaces the host file rather than truncating it in place — git
      # checkout/merge/pull/stash, vim, sed -i, VS Code — leaves this container
      # pinned to the old, orphaned inode. It then cannot see host edits at all,
      # and `squid -k reconfigure` re-reads the stale copy and exits 0, so the
      # reload looks successful. A directory mount resolves the path on every
      # open(), so the container always sees current bytes.
      #
      # This is not hypothetical and not an inconvenience. It meant the repo's
      # allowlist was ADVISORY, not authoritative: tightening it in git did not
      # take effect on a running proxy. Found live twice — G9 (2026-07-31, all
      # three proxies still tunnelling a domain the repo had gated) and again
      # 2026-08-03, when a comment-only merge blinded two proxies and broke the
      # only install route with an error that named nothing.
      #
      # Mount at a SUB-PATH. Never overmount /etc/squid wholesale — the image
      # keeps errorpage.css and conf.d/ there.
      - ./proxy:/etc/squid/host:ro
    # Squid needs SETUID+SETGID at startup to drop from root to the `proxy`
    # user. 3128 is unprivileged, so NET_BIND_SERVICE is NOT needed.
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.5
    networks:
      sandbox-internal:
        ipv4_address: 172.30.${SANDBOX_OCTET:-0}.10
      sandbox-external:
    restart: "no"

networks:
  # Agent-only network. internal: true is LOAD-BEARING — removing it turns the
  # proxy into a suggestion (see audit §4).
  sandbox-internal:
    driver: bridge
    internal: true
    # Static subnet so we can pin egress-proxy/postgres/mongo/ollama to known IPs
    # and feed them to the agent via extra_hosts. Required to make the
    # dns: [127.0.0.1] sinkhole workable — without static IPs we'd have no
    # reliable way to pre-populate /etc/hosts.
    #
    # The /24's third octet (SANDBOX_OCTET) is allocated per-profile by
    # profile.sh (ensure_subnet_octet) and persisted to
    # ~/.ai-sandbox/profiles/<profile>/subnet-octet, so concurrent profiles
    # land on distinct /24s instead of all fighting over 172.30.0.0/24 (the
    # "Pool overlaps with other one on this address space" error). The same
    # variable drives the subnet AND the .10/.20/.30/.40 pins above, so the two
    # can never drift. Default 0 keeps the legacy subnet for the global
    # `build` (PROFILE=_build, never creates a network) and the
    # network-neutral `restart`/`ps` paths.
    ipam:
      config:
        - subnet: 172.30.${SANDBOX_OCTET:-0}.0/24
  # Proxy's outbound side only.
  sandbox-external:
    driver: bridge

volumes:
  postgres-data:
  mongo-data:
